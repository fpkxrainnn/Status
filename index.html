<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คสถานะ - FPKxRAINNN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', 'Kanit', sans-serif;
            background-color: #FDFBF7;
            color: #4A3E3D;
        }
        button, input {
            pointer-events: auto !important;
            cursor: pointer;
        }
        /* สร้างเส้นประแนวตั้ง */
        .vertical-line {
            position: absolute;
            left: 11px;
            top: 24px;
            bottom: -8px;
            width: 2px;
            border-left: 2px dashed #F7F4EF;
            z-index: 0;
        }
        .vertical-line-progress {
            position: absolute;
            left: 11px;
            top: 24px;
            width: 2px;
            height: 0%;
            border-left: 2px solid #BC9B8B;
            z-index: 1;
            transition: height 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-lg border border-gray-100">
        
        <!-- หัวข้อหน้าเว็บ: หัวใหญ่ + ชื่อร้านในกรอบสีชมพู -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wide mb-3" style="color: #8C6239;">ระบบเช็คสถานะ</h1>
            
            <div class="inline-block px-5 py-1.5 rounded-full border shadow-sm" style="background-color: #FFF5F7; border-color: #FFE5EC;">
                <span class="text-sm font-semibold tracking-wider" style="color: #8C6239;">FPKxRAINNN</span>
            </div>
        </div>

        <div class="flex p-1 rounded-xl mb-6" style="background-color: #F7F4EF;">
            <button id="tab-account" onclick="switchTab('account')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all focus:outline-none" style="background-color: #FFD1DC; color: #8C6239;">
                ชื่อแอคเค้าท์
            </button>
            <button id="tab-phone" onclick="switchTab('phone')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all focus:outline-none" style="color: #BC9B8B;">
                เบอร์โทรศัพท์
            </button>
        </div>

        <div class="space-y-4">
            <input type="text" id="search-input" placeholder="กรอกชื่อแอคเค้าท์ของคุณ" 
                   class="w-full px-4 py-3 border rounded-xl focus:outline-none text-base transition-all" style="background-color: #FDFBF7; border-color: #EADCC9; color: #8C6239;">
            
            <button id="search-btn" onclick="searchOrder()" class="w-full py-3.5 font-medium rounded-xl shadow-sm transition-all flex justify-center items-center focus:outline-none" style="background-color: #FFD1DC; color: #8C6239;">
                <span id="btn-text"><b>ตรวจสอบสถานะ</b></span>
            </button>
        </div>

        <!-- พื้นที่สำหรับแสดงผลออเดอร์ทั้งหมด -->
        <div id="orders-container" class="space-y-8 mt-8"></div>

        <div id="error-box" class="hidden mt-6 text-center text-sm p-3 rounded-xl border" style="color: #D16D6D; background-color: #FFF5F5; border-color: #FFE5EC;">
            ไม่พบข้อมูลออเดอร์ของคุณ กรุณาตรวจสอบข้อมูลอีกครั้งค่ะ
        </div>

    </div>

    <p class="text-xs mt-6" style="color: #BC9B8B;">© 2026 FPKxRAINNN. All rights reserved.</p>

    <script>
        const SHEET_ID = "15D9UCheHWBbkSbkCBZpMc-wx_T7uMn3KDKBFb-LqhC4";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        let currentSearchType = 'account';

        function switchTab(type) {
            currentSearchType = type;
            const tabAccount = document.getElementById('tab-account');
            const tabPhone = document.getElementById('tab-phone');
            const input = document.getElementById('search-input');

            if(type === 'account') {
                tabAccount.style.backgroundColor = "#FFD1DC";
                tabAccount.style.color = "#8C6239";
                tabPhone.style.backgroundColor = "transparent";
                tabPhone.style.color = "#BC9B8B";
                input.placeholder = "กรอกชื่อแอคเค้าท์ของคุณ";
            } else {
                tabAccount.style.backgroundColor = "transparent";
                tabAccount.style.color = "#BC9B8B";
                tabPhone.style.backgroundColor = "#FFD1DC";
                tabPhone.style.color = "#8C6239";
                input.placeholder = "กรอกเบอร์โทรศัพท์ 10 หลักของคุณ";
            }
        }

        function cleanCell(cell) {
            if (!cell) return "";
            return cell.replace(/^"|"$/g, '').trim();
        }

        async function searchOrder() {
            const inputValue = document.getElementById('search-input').value.trim().toLowerCase();
            const container = document.getElementById('orders-container');
            const errorBox = document.getElementById('error-box');
            const btnText = document.getElementById('btn-text');
            const searchBtn = document.getElementById('search-btn');
            
            if(!inputValue) {
                alert("กรุณากรอกข้อมูลก่อนกดค้นหาค่ะ");
                return;
            }

            btnText.innerHTML = "<b>กำลังค้นหา...</b>";
            searchBtn.disabled = true;
            container.innerHTML = "";
            errorBox.classList.add('hidden');

            try {
                const response = await fetch(CSV_URL);
                const dataText = await response.text();
                
                const lines = dataText.split(/\r?\n/);
                let matchedOrders = [];

                for(let i = 1; i < lines.length; i++) {
                    if (!lines[i]) continue;
                    
                    let cols = lines[i].split(/[,;]/);
                    if(!cols[0]) continue;
                    
                    const sheetAccount = cleanCell(cols[1]).toLowerCase();
                    const sheetPhone = cols[2] ? cleanCell(cols[2]).replace(/-/g, "") : "";
                    const cleanInput = inputValue.replace(/-/g, "");

                    if(currentSearchType === 'account' && sheetAccount === cleanInput) {
                        matchedOrders.push(cols.map(c => cleanCell(c)));
                    } else if(currentSearchType === 'phone' && sheetPhone === cleanInput) {
                        matchedOrders.push(cols.map(c => cleanCell(c)));
                    }
                }

                if(matchedOrders.length > 0) {
                    errorBox.classList.add('hidden');
                    
                    matchedOrders.forEach((order, index) => {
                        const date = order[0] || "-";
                        const product = order[3] || "-";
                        const payStatus = order[4] || "-";
                        const shippingStatus = order[5] || "-";
                        const tracking = order[6] || "-";
                        const note = order[7] || "";
                        const etaChinaToThai = order[8] || ""; 

                        let badgeColor = "background-color: #F1F3F4; color: #5F6368;";
                        let badgeText = "Pending";
                        if(payStatus.includes("จ่ายครบแล้ว") || payStatus.includes("สำเร็จ") || payStatus.toLowerCase().includes("paid")) {
                            badgeColor = "background-color: #E6F4EA; color: #137333;";
                            badgeText = "Paid";
                        } else if (payStatus.includes("มัดจำ")) {
                            badgeColor = "background-color: #FEF7E0; color: #B06000;";
                            badgeText = "Deposit";
                        }

                        const orderHtml = `
                            <div class="pt-6 border-t space-y-5" style="border-color: #F7F4EF;">
                                <div class="text-xs font-bold px-1" style="color: #8C6239;">📦 ออเดอร์ที่ ${index + 1}</div>
                                
                                <!-- วันที่สั่งซื้อ -->
                                <div class="p-4 rounded-xl border flex justify-between items-center" style="background-color: #FDFBF7; border-color: #F3EBE1;">
                                    <div>
                                        <p class="text-xs font-medium uppercase tracking-wider" style="color: #BC9B8B;">วันที่สั่งซื้อ</p>
                                        <p class="text-base font-medium mt-1" style="color: #8C6239;">${date}</p>
                                    </div>
                                </div>

                                <!-- คาดว่าจะถึงไทย -->
                                <div id="eta-box-${index}" class="${etaChinaToThai ? '' : 'hidden'} p-4 rounded-xl border flex justify-between items-center" style="background-color: #FDFBF7; border-color: #F3EBE1;">
                                    <div>
                                        <p class="text-xs font-medium uppercase tracking-wider" style="color: #BC9B8B;">✈️ คาดว่าจะถึงไทย</p>
                                        <p class="text-base font-medium mt-1" style="color: #8C6239;">${etaChinaToThai || '-'}</p>
                                    </div>
                                </div>

                                <!-- ข้อมูลสินค้า -->
                                <div class="p-4 rounded-xl border" style="background-color: #FDFBF7; border-color: #F3EBE1;">
                                    <p class="text-xs font-medium uppercase tracking-wider" style="color: #BC9B8B;">สินค้าของคุณ</p>
                                    <p class="text-base font-medium mt-1" style="color: #8C6239;">${product}</p>
                                </div>

                                <!-- การชำระเงิน -->
                                <div class="p-4 rounded-xl border flex justify-between items-center" style="background-color: #FDFBF7; border-color: #F3EBE1;">
                                    <div>
                                        <p class="text-xs font-medium uppercase tracking-wider" style="color: #BC9B8B;">การชำระเงิน</p>
                                        <p class="text-base font-semibold mt-1" style="color: #8C6239;">${payStatus}</p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-medium" style="${badgeColor}">${badgeText}</span>
                                </div>

                                <!-- สถานะสินค้าแนวตั้ง -->
                                <div>
                                    <p class="text-xs font-medium uppercase tracking-wider mb-4" style="color: #BC9B8B;">สถานะสินค้าล่าสุด</p>
                                    <div class="space-y-6 pl-2">
                                        <div class="relative flex items-start">
                                            <div class="vertical-line"></div>
                                            <div id="line-p1-${index}" class="vertical-line-progress"></div>
                                            <div id="step-1-${index}" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white z-10 transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                                            <div class="ml-4"><p id="txt-1-${index}" class="text-sm font-medium" style="color: #BC9B8B;">สั่งผลิตเรียบร้อย</p></div>
                                        </div>
                                        <div class="relative flex items-start">
                                            <div class="vertical-line"></div>
                                            <div id="line-p2-${index}" class="vertical-line-progress"></div>
                                            <div id="step-2-${index}" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white z-10 transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                                            <div class="ml-4"><p id="txt-2-${index}" class="text-sm font-medium" style="color: #BC9B8B;">ของถึงโกดังจีน</p></div>
                                        </div>
                                        <div class="relative flex items-start">
                                            <div class="vertical-line"></div>
                                            <div id="line-p3-${index}" class="vertical-line-progress"></div>
                                            <div id="step-3-${index}" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white z-10 transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                                            <div class="ml-4"><p id="txt-3-${index}" class="text-sm font-medium" style="color: #BC9B8B;">ของถึงโกดังไทย</p></div>
                                        </div>
                                        <div class="relative flex items-start">
                                            <div class="vertical-line"></div>
                                            <div id="line-p4-${index}" class="vertical-line-progress"></div>
                                            <div id="step-4-${index}" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white z-10 transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                                            <div class="ml-4"><p id="txt-4-${index}" class="text-sm font-medium" style="color: #BC9B8B;">ของถึงร้านรอจัดส่ง</p></div>
                                        </div>
                                        <div class="relative flex items-start">
                                            <div id="step-5-${index}" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white z-10 transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                                            <div class="ml-4"><p id="txt-5-${index}" class="text-sm font-medium" style="color: #BC9B8B;">จัดส่งเรียบร้อย</p></div>
                                        </div>
                                    </div>
                                </div>

                                <div id="tracking-box-${index}" class="hidden p-4 rounded-xl border flex justify-between items-center" style="background-color: #FFF5F7; border-color: #FFE5EC;">
                                    <div>
                                        <p class="text-xs font-medium" style="color: #F3B0C3;">เลขพัสดุของคุณ</p>
                                        <p id="res-tracking-${index}" class="text-base font-bold mt-0.5" style="color: #8C6239;">${tracking}</p>
                                    </div>
                                    <button onclick="copyTracking('${tracking}')" class="text-xs bg-white border px-3 py-1.5 rounded-lg transition-all focus:outline-none" style="border-color: #FFE5EC; color: #8C6239;">คัดลอก</button>
                                </div>

                                <div id="note-box-${index}" class="hidden p-4 rounded-xl text-xs leading-relaxed" style="background-color: #F7F4EF; color: #8C6239;">
                                    <strong>หมายเหตุ:</strong> <span>${note}</span>
                                </div>
                            </div>
                        `;
                        
                        container.insertAdjacentHTML('beforeend', orderHtml);
                        
                        updateProgressBar(shippingStatus, index);

                        if(shippingStatus === "จัดส่งเรียบร้อย" && tracking !== "-") {
                            document.getElementById(`tracking-box-${index}`).classList.remove('hidden');
                        }
                        if(note !== "") {
                            document.getElementById(`note-box-${index}`).classList.remove('hidden');
                        }
                    });

                } else {
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล กรุณาลองใหมี่อีกครั้งค่ะ");
            } finally {
                btnText.innerHTML = "<b>ตรวจสอบสถานะ</b>";
                searchBtn.disabled = false;
            }
        }

        function updateProgressBar(status, index) {
            const s1 = document.getElementById(`step-1-${index}`); const t1 = document.getElementById(`txt-1-${index}`); const l1 = document.getElementById(`line-p1-${index}`);
            const s2 = document.getElementById(`step-2-${index}`); const t2 = document.getElementById(`txt-2-${index}`); const l2 = document.getElementById(`line-p2-${index}`);
            const s3 = document.getElementById(`step-3-${index}`); const t3 = document.getElementById(`txt-3-${index}`); const l3 = document.getElementById(`line-p3-${index}`);
            const s4 = document.getElementById(`step-4-${index}`); const t4 = document.getElementById(`txt-4-${index}`); const l4 = document.getElementById(`line-p4-${index}`);
            const s5 = document.getElementById(`step-5-${index}`); const t5 = document.getElementById(`txt-5-${index}`);

            const steps = [s1, s2, s3, s4, s5];
            const texts = [t1, t2, t3, t4, t5];
            const lines = [l1, l2, l3, l4];

            if(status === "สั่งผลิตเรียบร้อย") {
                s1.style.backgroundColor = "#8C6239"; s1.style.borderColor = "#8C6239"; s1.innerHTML = "✓";
                t1.style.color = "#8C6239"; t1.classList.add('font-semibold');
            } else if(status === "ของถึงโกดังจีน") {
                s1.style.backgroundColor = "#BC9B8B"; s1.style.borderColor = "#BC9B8B"; s1.innerHTML = "✓";
                s2.style.backgroundColor = "#8C6239"; s2.style.borderColor = "#8C6239"; s2.innerHTML = "✓";
                t2.style.color = "#8C6239"; t2.classList.add('font-semibold');
                l1.style.height = "100%";
            } else if(status === "ของถึงโกดังไทย") {
                s1.style.backgroundColor = "#BC9B8B"; s1.style.borderColor = "#BC9B8B"; s1.innerHTML = "✓";
                s2.style.backgroundColor = "#BC9B8B"; s2.style.borderColor = "#BC9B8B"; s2.innerHTML = "✓";
                s3.style.backgroundColor = "#8C6239"; s3.style.borderColor = "#8C6239"; s3.innerHTML = "✓";
                t3.style.color = "#8C6239"; t3.classList.add('font-semibold');
                l1.style.height = "100%"; l2.style.height = "100%";
            } else if(status === "ของถึงร้านรอจัดส่ง") {
                s1.style.backgroundColor = "#BC9B8B"; s1.style.borderColor = "#BC9B8B"; s1.innerHTML = "✓";
                s2.style.backgroundColor = "#BC9B8B"; s2.style.borderColor = "#BC9B8B"; s2.innerHTML = "✓";
                s3.style.backgroundColor = "#BC9B8B"; s3.style.borderColor = "#BC9B8B"; s3.innerHTML = "✓";
                s4.style.backgroundColor = "#8C6239"; s4.style.borderColor = "#8C6239"; s4.innerHTML = "✓";
                t4.style.color = "#8C6239"; t4.classList.add('font-semibold');
                l1.style.height = "100%"; l2.style.height = "100%"; l3.style.height = "100%";
            } else if(status === "จัดส่งเรียบร้อย") {
                steps.forEach(s => { s.style.backgroundColor = "#BC9B8B"; s.style.borderColor = "#BC9B8B"; s.innerHTML = "✓"; });
                s5.style.backgroundColor = "#8C6239"; s5.style.borderColor = "#8C6239";
                t5.style.color = "#8C6239"; t5.classList.add('font-semibold');
                lines.forEach(l => { l.style.height = "100%"; });
            }
        }

        function copyTracking(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("คัดลอกเลขพัสดุเรียบร้อยแล้วค่ะ!");
            });
        }
    </script>
</body>
</html>
