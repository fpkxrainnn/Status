<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fpkxrainnn - Check Status</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', 'Kanit', sans-serif;
            background-color: #FDFBF7;
            color: #4A3E3D;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-xl shadow-[#F3EBE1] border border-[#F3EBE1]">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wide text-[#8C6239]">fpkxrainnn</h1>
            <p class="text-sm text-[#BC9B8B] mt-1">Check Your Order Status</p>
        </div>

        <div class="flex bg-[#F7F4EF] p-1 rounded-xl mb-6">
            <button id="tab-account" onclick="switchTab('account')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-[#FFD1DC] text-[#8C6239] transition-all">
                ชื่อแอคเค้าท์
            </button>
            <button id="tab-phone" onclick="switchTab('phone')" class="flex-1 py-2 text-sm font-medium rounded-lg text-[#BC9B8B] transition-all">
                เบอร์โทรศัพท์
            </button>
        </div>

        <div class="space-y-4">
            <div class="relative">
                <input type="text" id="search-input" placeholder="กรอกชื่อแอคเค้าท์ของคุณ" 
                       class="w-full px-4 py-3 bg-[#FDFBF7] border border-[#EADCC9] rounded-xl focus:outline-none focus:border-[#FFD1DC] focus:ring-2 focus:ring-[#FFD1DC] text-base transition-all">
            </div>
            <button id="search-btn" onclick="searchOrder()" class="w-full py-3.5 bg-[#FFD1DC] hover:bg-[#F3B0C3] text-[#8C6239] font-medium rounded-xl shadow-md shadow-[#FFE5EC] transition-all cursor-pointer flex justify-center items-center">
                <span id="btn-text">ตรวจสอบสถานะ</span>
            </button>
        </div>

        <div id="result-box" class="hidden mt-8 pt-6 border-t border-[#F7F4EF] space-y-5">
            
            <div class="bg-[#FDFBF7] p-4 rounded-xl border border-[#F3EBE1]">
                <p class="text-xs text-[#BC9B8B] font-medium uppercase tracking-wider">สินค้าของคุณ</p>
                <p id="res-product" class="text-base font-medium text-[#4A3E3D] mt-1">-</p>
            </div>

            <div class="bg-[#FDFBF7] p-4 rounded-xl border border-[#F3EBE1] flex justify-between items-center">
                <div>
                    <p class="text-xs text-[#BC9B8B] font-medium uppercase tracking-wider">การชำระเงิน</p>
                    <p id="res-payment" class="text-base font-semibold text-[#8C6239] mt-1">-</p>
                </div>
                <span id="payment-badge" class="px-3 py-1 rounded-full text-xs font-medium"></span>
            </div>

            <div>
                <p class="text-xs text-[#BC9B8B] font-medium uppercase tracking-wider mb-4">สถานะการจัดส่ง</p>
                <div class="relative flex items-center justify-between">
                    <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-[#F7F4EF] z-0"></div>
                    <div id="progress-line" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-[#BC9B8B] w-0 z-0 transition-all duration-500"></div>

                    <div class="z-10 flex flex-col items-center">
                        <div id="step-1" class="w-6 h-6 rounded-full bg-[#F7F4EF] border-2 border-[#EADCC9] flex items-center justify-center text-xs text-white transition-all"></div>
                        <span class="text-[11px] mt-1 text-[#BC9B8B] font-medium">รับออเดอร์</span>
                    </div>
                    <div class="z-10 flex flex-col items-center">
                        <div id="step-2" class="w-6 h-6 rounded-full bg-[#F7F4EF] border-2 border-[#EADCC9] flex items-center justify-center text-xs text-white transition-all"></div>
                        <span class="text-[11px] mt-1 text-[#BC9B8B] font-medium">กำลังผลิต</span>
                    </div>
                    <div class="z-10 flex flex-col items-center">
                        <div id="step-3" class="w-6 h-6 rounded-full bg-[#F7F4EF] border-2 border-[#EADCC9] flex items-center justify-center text-xs text-white transition-all"></div>
                        <span class="text-[11px] mt-1 text-[#BC9B8B] font-medium">จัดส่งแล้ว</span>
                    </div>
                </div>
            </div>

            <div id="tracking-box" class="hidden bg-[#FFF5F7] p-4 rounded-xl border border-[#FFE5EC] flex justify-between items-center">
                <div>
                    <p class="text-xs text-[#F3B0C3] font-medium">เลขพัสดุของคุณ</p>
                    <p id="res-tracking" class="text-base font-bold text-[#8C6239] mt-0.5">-</p>
                </div>
                <button onclick="copyTracking()" class="text-xs bg-white border border-[#FFE5EC] text-[#8C6239] px-3 py-1.5 rounded-lg hover:bg-[#FFD1DC] transition-all cursor-pointer">
                    คัดลอก
                </button>
            </div>

            <div id="note-box" class="hidden bg-[#F7F4EF] p-4 rounded-xl text-xs text-[#8C6239] leading-relaxed">
                <strong>หมายเหตุ:</strong> <span id="res-note">-</span>
            </div>
        </div>

        <div id="error-box" class="hidden mt-6 text-center text-sm text-[#D16D6D] bg-[#FFF5F5] p-3 rounded-xl border border-[#FFE5EC]">
            ไม่พบข้อมูลออเดอร์ของคุณ กรุณาตรวจสอบข้อมูลอีกครั้งค่ะ
        </div>

    </div>

    <p class="text-xs text-[#BC9B8B] mt-6">© 2026 fpkxrainnn. All rights reserved.</p>

    <script>
        // เชื่อมโยงกับ Google Sheets ของคุณโดยตรงแบบปลอดภัย
        const SHEET_ID = "15D9UCheHWBbkSbkCBZpMc-wx_T7uMn3KDKBFb-LqhC4";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        let currentSearchType = 'account';

        function switchTab(type) {
            currentSearchType = type;
            const tabAccount = document.getElementById('tab-account');
            const tabPhone = document.getElementById('tab-phone');
            const input = document.getElementById('search-input');

            if(type === 'account') {
                tabAccount.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-[#FFD1DC] text-[#8C6239] transition-all";
                tabPhone.className = "flex-1 py-2 text-sm font-medium rounded-lg text-[#BC9B8B] transition-all";
                input.placeholder = "กรอกชื่อแอคเค้าท์ของคุณ";
            } else {
                tabAccount.className = "flex-1 py-2 text-sm font-medium rounded-lg text-[#BC9B8B] transition-all";
                tabPhone.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-[#FFD1DC] text-[#8C6239] transition-all";
                input.placeholder = "กรอกเบอร์โทรศัพท์ 10 หลักของคุณ";
            }
        }

        async function searchOrder() {
            const inputValue = document.getElementById('search-input').value.trim().toLowerCase();
            const resultBox = document.getElementById('result-box');
            const errorBox = document.getElementById('error-box');
            const btnText = document.getElementById('btn-text');
            const searchBtn = document.getElementById('search-btn');
            
            if(!inputValue) {
                alert("กรุณากรอกข้อมูลก่อนกดค้นหาค่ะ");
                return;
            }

            btnText.innerText = "กำลังค้นหา...";
            searchBtn.disabled = true;
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const response = await fetch(CSV_URL);
                const dataText = await response.text();
                
                const rows = dataText.split("\n").map(row => row.split(`,`).map(cell => cell.replace(/^"|"$/g, '').trim()));
                let foundData = null;

                for(let i = 1; i < rows.length; i++) {
                    if(!rows[i][0]) continue;
                    
                    const sheetAccount = rows[i][0].toLowerCase();
                    const sheetPhone = rows[i][1] ? rows[i][1].replace(/-/g, "") : "";
                    const cleanInput = inputValue.replace(/-/g, "");

                    if(currentSearchType === 'account' && sheetAccount === cleanInput) {
                        foundData = rows[i];
                        break;
                    } else if(currentSearchType === 'phone' && sheetPhone === cleanInput) {
                        foundData = rows[i];
                        break;
                    }
                }

                if(foundData) {
                    errorBox.classList.add('hidden');
                    resultBox.classList.remove('hidden');
                    
                    document.getElementById('res-product').innerText = foundData[2] || "-";
                    
                    const payStatus = foundData[3] || "-";
                    document.getElementById('res-payment').innerText = payStatus;
                    const badge = document.getElementById('payment-badge');
                    
                    if(payStatus.includes("แล้ว") || payStatus.includes("สำเร็จ") || payStatus.toLowerCase().includes("paid")) {
                        badge.className = "px-3 py-1 rounded-full text-xs font-medium bg-[#E6F4EA] text-[#137333]";
                        badge.innerText = "Paid";
                    } else {
                        badge.className = "px-3 py-1 rounded-full text-xs font-medium bg-[#FEF7E0]
