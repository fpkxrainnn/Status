<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fpkxrainnn - Check Status</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', 'Kanit', sans-serif;
            background-color: #FDFBF7;
            color: #4A3E3D;
        }
        button, input {
            pointer-events: auto !important;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-lg border border-gray-100">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-wide text-amber-900" style="color: #8C6239;">fpkxrainnn</h1>
            <p class="text-sm mt-1" style="color: #BC9B8B;">Check Your Order Status</p>
        </div>

        <div class="flex p-1 rounded-xl mb-6" style="background-color: #F7F4EF;">
            <button id="tab-account" onclick="switchTab('account')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all focus:outline-none" style="background-color: #FFD1DC; color: #8C6239;">
                ชื่อแอคเค้าท์
            </button>
            <button id="tab-phone" onclick="switchTab('phone')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all focus:outline-none" style="color: #BC9B8B;">
                เบอร์โทรศัพท์
            </button>
        </div>

        <div class="space-y-4">
            <input type="text" id="search-input" placeholder="กรอกชื่อแอคเค้าท์ของคุณ" 
                   class="w-full px-4 py-3 border rounded-xl focus:outline-none text-base transition-all" style="background-color: #FDFBF7; border-color: #EADCC9;">
            
            <button id="search-btn" onclick="searchOrder()" class="w-full py-3.5 font-medium rounded-xl shadow-sm transition-all flex justify-center items-center focus:outline-none" style="background-color: #FFD1DC; color: #8C6239;">
                <span id="btn-text"><b>ตรวจสอบสถานะ</b></span>
            </button>
        </div>

        <div id="result-box" class="hidden mt-8 pt-6 border-t space-y-5" style="border-color: #F7F4EF;">
            
            <div class="p-4 rounded-xl border" style="background-color: #FDFBF7; border-color: #F3EBE1;">
                <p class="text-xs font-medium uppercase tracking-wider" style="color: #BC9B8B;">สินค้าของคุณ</p>
                <p id="res-product" class="text-base font-medium mt-1" style="color: #4A3E3D;">-</p>
            </div>

            <div class="p-4 rounded-xl border flex justify-between items-center" style="background-color: #FDFBF7; border-color: #F3EBE1;">
                <div>
                    <p class="text-xs font-medium uppercase tracking-wider" style="color: #BC9B8B;">การชำระเงิน</p>
                    <p id="res-payment" class="text-base font-semibold mt-1" style="color: #8C6239;">-</p>
                </div>
                <span id="payment-badge" class="px-3 py-1 rounded-full text-xs font-medium"></span>
            </div>

            <div>
                <p class="text-xs font-medium uppercase tracking-wider mb-4" style="color: #BC9B8B;">สถานะการจัดส่ง</p>
                <div class="relative flex items-center justify-between">
                    <div class="absolute left-0 right-0 top-1/2 transform -translate-y-1/2 h-1 z-0" style="background-color: #F7F4EF;"></div>
                    <div id="progress-line" class="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 w-0 z-0 transition-all duration-500" style="background-color: #BC9B8B;"></div>

                    <div class="z-10 flex flex-col items-center">
                        <div id="step-1" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                        <span class="text-[11px] mt-1 font-medium" style="color: #BC9B8B;">รับออเดอร์</span>
                    </div>
                    <div class="z-10 flex flex-col items-center">
                        <div id="step-2" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                        <span class="text-[11px] mt-1 font-medium" style="color: #BC9B8B;">กำลังผลิต</span>
                    </div>
                    <div class="z-10 flex flex-col items-center">
                        <div id="step-3" class="w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs text-white transition-all" style="background-color: #F7F4EF; border-color: #EADCC9;"></div>
                        <span class="text-[11px] mt-1 font-medium" style="color: #BC9B8B;">จัดส่งแล้ว</span>
                    </div>
                </div>
            </div>

            <div id="tracking-box" class="hidden p-4 rounded-xl border flex justify-between items-center" style="background-color: #FFF5F7; border-color: #FFE5EC;">
                <div>
                    <p class="text-xs font-medium" style="color: #F3B0C3;">เลขพัสดุของคุณ</p>
                    <p id="res-tracking" class="text-base font-bold mt-0.5" style="color: #8C6239;">-</p>
                </div>
                <button onclick="copyTracking()" class="text-xs bg-white border px-3 py-1.5 rounded-lg transition-all focus:outline-none" style="border-color: #FFE5EC; color: #8C6239;">
                    คัดลอก
                </button>
            </div>

            <div id="note-box" class="hidden p-4 rounded-xl text-xs leading-relaxed" style="background-color: #F7F4EF; color: #8C6239;">
                <strong>หมายเหตุ:</strong> <span id="res-note">-</span>
            </div>
        </div>

        <div id="error-box" class="hidden mt-6 text-center text-sm p-3 rounded-xl border" style="color: #D16D6D; background-color: #FFF5F5; border-color: #FFE5EC;">
            ไม่พบข้อมูลออเดอร์ของคุณ กรุณาตรวจสอบข้อมูลอีกครั้งค่ะ
        </div>

    </div>

    <p class="text-xs mt-6" style="color: #BC9B8B;">© 2026 fpkxrainnn. All rights reserved.</p>

    <script>
        const SHEET_ID = "15D9UCheHWBbkSbkCBZpMc-wx_T7uMn3KDKBFb-LqhC4";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

        let currentSearchType = 'account';

        function switchTab(type) {
            currentSearchType = type;
            const tabAccount = document.getElementById('tab-account');
            const tabPhone = document.getElementById('tab-phone');
            const input = document.getElementById('search-input');

            if(type === 'account') {
                tabAccount.style.backgroundColor = "#FFD1DC";
                tabAccount.style.color = "#8C6239";
                tabPhone.style.backgroundColor = "transparent";
                tabPhone.style.color = "#BC9B8B";
                input.placeholder = "กรอกชื่อแอคเค้าท์ของคุณ";
            } else {
                tabAccount.style.backgroundColor = "transparent";
                tabAccount.style.color = "#BC9B8B";
                tabPhone.style.backgroundColor = "#FFD1DC";
                tabPhone.style.color = "#8C6239";
                input.placeholder = "กรอกเบอร์โทรศัพท์ 10 หลักของคุณ";
            }
        }

        // ฟังก์ชันล้างเครื่องหมายคำพูดส่วนเกิน
        function cleanCell(cell) {
            if (!cell) return "";
            return cell.replace(/^"|"$/g, '').trim();
        }

        async function searchOrder() {
            const inputValue = document.getElementById('search-input').value.trim().toLowerCase();
            const resultBox = document.getElementById('result-box');
            const errorBox = document.getElementById('error-box');
            const btnText = document.getElementById('btn-text');
            const searchBtn = document.getElementById('search-btn');
            
            if(!inputValue) {
                alert("กรุณากรอกข้อมูลก่อนกดค้นหาค่ะ");
                return;
            }

            btnText.innerHTML = "<b>กำลังค้นหา...</b>";
            searchBtn.disabled = true;
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const response = await fetch(CSV_URL);
                const dataText = await response.text();
                
                // แก้ไขระบบแยกแถวและช่องอัจฉริยะ ป้องกันปัญหาระบบคั่นด้วยคอมมาหรือเซมิโคลอน
                const lines = dataText.split(/\r?\n/);
                let foundData = null;

                for(let i = 1; i < lines.length; i++) {
                    if (!lines[i]) continue;
                    
                    // แตกช่องโดยเช็คทั้งเครื่องหมาย , และ ;
                    let cols = lines[i].split(/[,;]/);
                    if(!cols[0]) continue;
                    
                    const sheetAccount = cleanCell(cols[0]).toLowerCase();
                    const sheetPhone = cols[1] ? cleanCell(cols[1]).replace(/-/g, "") : "";
                    const cleanInput = inputValue.replace(/-/g, "");

                    if(currentSearchType === 'account' && sheetAccount === cleanInput) {
                        foundData = cols.map(c => cleanCell(c));
                        break;
                    } else if(currentSearchType === 'phone' && sheetPhone === cleanInput) {
                        foundData = cols.map(c => cleanCell(c));
                        break;
                    }
                }

                if(foundData) {
                    errorBox.classList.add('hidden');
                    resultBox.classList.remove('hidden');
                    
                    document.getElementById('res-product').innerText = foundData[2] || "-";
                    
                    const payStatus = foundData[3] || "-";
                    document.getElementById('res-payment').innerText = payStatus;
                    const badge = document.getElementById('payment-badge');
                    
                    if(payStatus.includes("แล้ว") || payStatus.includes("สำเร็จ") || payStatus.toLowerCase().includes("paid")) {
                        badge.style.backgroundColor = "#E6F4EA";
                        badge.style.color = "#137333";
                        badge.innerText = "Paid";
                    } else {
                        badge.style.backgroundColor = "#FEF7E0";
                        badge.style.color = "#B06000";
                        badge.innerText = "Pending";
                    }
                    
                    const shippingStatus = foundData[4] || "-";
                    updateProgressBar(shippingStatus);

                    const trackingBox = document.getElementById('tracking-box');
                    if((shippingStatus === "จัดส่งแล้ว" || shippingStatus === "เตรียมจัดส่ง") && foundData[5] && foundData[5] !== "-") {
                        trackingBox.classList.remove('hidden');
                        document.getElementById('res-tracking').innerText = foundData[5];
                    } else {
                        trackingBox.classList.add('hidden');
                    }

                    const noteBox = document.getElementById('note-box');
                    if(foundData[6] && foundData[6] !== "") {
                        noteBox.classList.remove('hidden');
                        document.getElementById('res-note').innerText = foundData[6];
                    } else {
                        noteBox.classList.add('hidden');
                    }
                } else {
                    errorBox.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล กรุณาลองใหมี่อีกครั้งค่ะ");
            } finally {
                btnText.innerHTML = "<b>ตรวจสอบสถานะ</b>";
                searchBtn.disabled = false;
            }
        }

        function updateProgressBar(status) {
            const line = document.getElementById('progress-line');
            const s1 = document.getElementById('step-1');
            const s2 = document.getElementById('step-2');
            const s3 = document.getElementById('step-3');

            [s1, s2, s3].forEach(s => {
                s.style.backgroundColor = "#F7F4EF";
                s.style.borderColor = "#EADCC9";
                s.innerHTML = "";
            });
            line.style.width = "0%";

            if(status === "รับออเดอร์" || status === "รอดำเนินการ") {
                s1.style.backgroundColor = "#8C6239";
                s1.style.borderColor = "#8C6239";
                s1.innerHTML = "✓";
                line.style.width = "0%";
            } else if(status === "กำลังผลิต") {
                s1.style.backgroundColor = "#BC9B8B";
                s1.style.borderColor = "#BC9B8B";
                s2.style.backgroundColor = "#8C6239";
                s2.style.borderColor = "#8C6239";
                s1.innerHTML = "✓"; s2.innerHTML = "✓";
                line.style.width = "50%";
            } else if(status === "จัดส่งแล้ว" || status === "เตรียมจัดส่ง") {
                s1.style.backgroundColor = "#BC9B8B";
                s1.style.borderColor = "#BC9B8B";
                s2.style.backgroundColor = "#BC9B8B";
                s2.style.borderColor = "#BC9B8B";
                s3.style.backgroundColor = "#8C6239";
                s3.style.borderColor = "#8C6239";
                s1.innerHTML = "✓"; s2.innerHTML = "✓"; s3.innerHTML = "✓";
                line.style.width = "100%";
            }
        }

        function copyTracking() {
            const text = document.getElementById('res-tracking').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("คัดลอกเลขพัสดุเรียบร้อยแล้วค่ะ!");
            });
        }
    </script>
</body>
</html>
